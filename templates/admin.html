<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #1f4e79;
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            margin: 20px auto;
            max-width: 600px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #1f4e79;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            margin: 8px;
        }

        button:hover {
            background: #163a5c;
        }

        .back-button {
            background: #666;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Admin Dashboard</h1>
    <p>Student Placement Management System</p>
</header>

<div class="container">

    <div class="card">

        <h2>Welcome Admin</h2>

        <p>Manage students, companies and placement applications.</p>

        <button onclick="window.location.href='/admin/students'">
            Manage Students
        </button>

        <button onclick="window.location.href='/admin/companies'">
            Manage Companies
        </button>

        <button onclick="window.location.href='/admin/applications'">
            View Applications
        </button>

        <br>

        <button class="back-button"
                onclick="window.location.href='/'">
            Back to Home
        </button>

    </div>

</div>

</body>
</html>
